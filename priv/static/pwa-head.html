<meta name="apple-mobile-web-app-capable" content="yes">

<script>
/* FOUC guard — set data-theme before CSS paints (KV_THEME re-applies in platform.js) */
(function(){try{var k="kv.theme",p=localStorage.getItem(k)||"system";if(p!=="light"&&p!=="dark"&&p!=="system")p="system";var dark=p==="dark"||(p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);var r=document.documentElement;r.dataset.theme=dark?"dark":"light";r.dataset.themePref=p;r.style.colorScheme=dark?"dark":"light";}catch(e){}})();
</script>
