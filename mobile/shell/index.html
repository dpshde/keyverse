<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>keyverse</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; height: 100%;
      font-family: -apple-system, system-ui, sans-serif;
      background: #f7f5f0; color: #1a1814;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0f1317; color: #ece8e1; }
    }
    .wrap {
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      text-align: center; gap: .85rem;
    }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0; letter-spacing: -.01em; }
    p { margin: 0; max-width: 22rem; line-height: 1.45; opacity: .72; font-size: .95rem; }
    .err { color: #b33; opacity: 1; font-size: .88rem; }
    a.btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 2.75rem; padding: .65rem 1.15rem; margin-top: .35rem;
      border-radius: 999px; text-decoration: none; font-weight: 600; font-size: .92rem;
      background: #1a1814; color: #f7f5f0;
    }
    @media (prefers-color-scheme: dark) {
      a.btn { background: #ece8e1; color: #0f1317; }
    }
  </style>
  <script>
    // Production shell: hop into the live door host (or override via query / storage).
    (function () {
      var DEFAULT = "https://keyverse-production.up.railway.app";
      var params = new URLSearchParams(location.search);
      var target = params.get("host")
        || localStorage.getItem("kv_native_host")
        || DEFAULT;
      // Dev: when opened from tauri dev, prefer local mix server if reachable.
      var isTauri = !!(window.__TAURI_INTERNALS__ || window.__TAURI__);
      function go(url) {
        try { localStorage.setItem("kv_native_host", url.replace(/\/$/, "")); } catch (e) {}
        location.replace(url.replace(/\/?$/, "/") + (params.get("door") ? params.get("door") : ""));
      }
      // Allow pin: ?host=https://…  or door path after host
      if (params.get("host") || params.get("door")) {
        go(target);
        return;
      }
      // Probe local dev first when in Tauri debug, else production.
      var candidates = isTauri
        ? ["http://127.0.0.1:4180", DEFAULT]
        : [DEFAULT];
      var i = 0;
      function tryNext() {
        if (i >= candidates.length) {
          document.getElementById("status").textContent = "Could not reach a keyverse host.";
          document.getElementById("status").className = "err";
          document.getElementById("open").href = DEFAULT;
          document.getElementById("open").hidden = false;
          return;
        }
        var base = candidates[i++];
        var ctrl = new AbortController();
        var t = setTimeout(function () { ctrl.abort(); }, 1800);
        fetch(base.replace(/\/?$/, "/") + "manifest.webmanifest", {
          mode: "cors",
          signal: ctrl.signal,
          cache: "no-store"
        }).then(function (r) {
          clearTimeout(t);
          if (r.ok) go(base);
          else tryNext();
        }).catch(function () {
          clearTimeout(t);
          tryNext();
        });
      }
      // Small delay so splash paints
      setTimeout(tryNext, 40);
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <h1>keyverse</h1>
    <p id="status">Opening your notes…</p>
    <a class="btn" id="open" hidden href="https://keyverse-production.up.railway.app">Open in browser</a>
  </div>
</body>
</html>
