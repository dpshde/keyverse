name: Deploy Railway production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-railway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: pnpm check

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway production
        env:
          # Project token: Railway → keyverse project → Settings → Tokens
          # Then: gh secret set RAILWAY_TOKEN -R dpshde/keyverse
          # (If the job uses environment: production, set the secret on that
          # Environment as well as/instead of repo secrets.)
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Missing secret RAILWAY_TOKEN on repo dpshde/keyverse."
            echo "Create a Railway project token (Project → Settings → Tokens),"
            echo "then:  gh secret set RAILWAY_TOKEN -R dpshde/keyverse"
            echo "Optional env-scoped secret: same command with --env production"
            exit 1
          fi
          # Project token scopes a single project; still pass service/env explicitly.
          railway up --ci \
            --service keyverse \
            --environment production \
            -m "gha ${GITHUB_SHA:0:7} ${GITHUB_REF_NAME}"
